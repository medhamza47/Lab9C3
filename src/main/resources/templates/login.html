<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Application Sécurisée</title>
    <link rel="stylesheet" th:href="@{'/css/style.css'}">
</head>
<body>
    <div class="login-container">
        <h2>Veuillez vous identifier</h2>
        
        <div th:if="${param.error}" class="alert alert-error">
            Identifiant ou mot de passe invalide.
        </div>
        
        <div th:if="${param.logout}" class="alert alert-success">
            Vous avez été déconnecté avec succès.
        </div>

        <form th:action="@{'/login'}" method="post">
            <div class="form-group">
                <label for="username">Nom d'utilisateur :</label>
                <input type="text" id="username" name="username" required autofocus placeholder="Entrez votre nom d'utilisateur" />
            </div>
            <div class="form-group">
                <label for="password">Mot de passe :</label>
                <input type="password" id="password" name="password" required placeholder="Entrez votre mot de passe" />
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
            </div>
        </form>

        <div class="login-hint">
            <p><strong>Comptes de test (authentification en mémoire) :</strong></p>
            <ul>
                <li>Utilisateur simple : <code>user</code> / <code>1111</code> (Rôle: USER)</li>
                <li>Administrateur : <code>admin</code> / <code>1234</code> (Rôles: ADMIN, USER)</li>
            </ul>
            <p><a th:href="@{'/'}">Retour à la page d'accueil</a></p>
        </div>
    </div>
</body>
</html>
