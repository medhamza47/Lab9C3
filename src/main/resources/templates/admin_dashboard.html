<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Administrateur - Spring Security</title>
    <link rel="stylesheet" th:href="@{'/css/style.css'}">
</head>
<body>
    <div class="container">
        <header>
            <h2>Tableau de bord Administrateur</h2>
            <p class="subtitle">Zone hautement sécurisée réservée aux membres avec le rôle ADMIN</p>
        </header>

        <div class="card card-admin">
            <h3>Bienvenue, Administrateur <span sec:authentication="name">Admin</span> !</h3>
            <p>Privilèges accordés : <span sec:authentication="principal.authorities" class="badge badge-admin"></span></p>
            <p>Vous avez accès aux fonctionnalités d'administration système (<code>/admin/dashboard</code>).</p>
        </div>

        <div class="nav-links">
            <a th:href="@{'/'}" class="btn btn-secondary">Retour à l'accueil</a>
            <a th:href="@{'/user/dashboard'}" class="btn btn-primary">Espace Utilisateur</a>
            <form th:action="@{'/logout'}" method="post" style="display:inline-block; margin-top:10px;">
                <button type="submit" class="btn btn-danger">Se déconnecter</button>
            </form>
        </div>
    </div>
</body>
</html>
